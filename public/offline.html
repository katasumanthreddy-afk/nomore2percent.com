<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>You're offline — nomore2percent</title>
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #fafaf9; color: #1c1917; padding: 24px;
    }
    .logo {
      width: 56px; height: 56px; border-radius: 14px; background: #fb923c;
      color: white; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 20px; margin-bottom: 20px; font-family: Georgia, serif;
    }
    h1 { font-size: 20px; margin: 0 0 8px; }
    p { color: #78716c; font-size: 14px; max-width: 320px; margin: 0 0 20px; }
    button {
      background: #fb923c; color: white; border: none; border-radius: 8px;
      padding: 10px 20px; font-size: 14px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="logo">N2</div>
  <h1>You're offline</h1>
  <p>Looks like there's no internet connection right now. Reconnect and try again — your last viewed pages may still be available.</p>
  <button onclick="window.location.reload()">Try Again</button>
</body>
</html>
